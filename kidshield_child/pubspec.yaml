name: kidshield_child
description: "KidShield Junior - Smart Child Safety and Companion App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.3
  http: ^1.2.2
  flutter_screenutil: ^5.9.3
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
