name: kidshield_parent
description: "Smart Child Safety and Parental Monitoring - Parent Console"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  fl_chart: ^1.3.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
  http: ^1.2.2
  flutter_screenutil: ^5.9.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2

dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
